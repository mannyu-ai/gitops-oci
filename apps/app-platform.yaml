apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mannyu-ai/gitops-oci.git
    targetRevision: main
    path: platform                    # ⭐ 純 YAML 資料夾，不是 Helm（ArgoCD 自動判斷）
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
