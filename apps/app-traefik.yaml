apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io       # 第 5 題：刪 App 時連資源一起刪
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts    # 第三方 chart，不改模板，只給 values
    chart: traefik
    targetRevision: 42.1.3                # ⭐ 換成步驟一查到的版本（鎖定！）
    helm:
      valuesObject:                               # 7C 課的設定，從 --set 搬進 Git
        deployment:
          replicas: 2
        service:
          spec:
            type: NodePort
        ports:
          web:
            nodePort: 30080
          websecure:
            nodePort: 30443
        providers:
          kubernetesIngress:
            publishedService:
              enabled: false
        additionalArguments:
        - --providers.kubernetesingress.ingressendpoint.ip=192.168.188.133
        ingressClass:
          enabled: true
          isDefaultClass: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true                        # ⭐ 第 1 題：CRD 太大，用 server-side apply
